<div class="flex gap-5 justify-center items-center mt-5 relative">
    <button type="button" (click)="close()" class="absolute -top-4 -right-1 w-8 h-8 flex justify-center items-center rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors z-10">
        <i class="pi pi-times"></i>
    </button>
    <a [href]="dog().imgUrl" target="_blank"
        class="flex justify-center items-center relative rounded-xl overflow-hidden group w-100 h-80">
        <div
            class="flex justify-center items-center z-2 absolute bg-amber-500/50 opacity-0 transition-opacity group-hover:opacity-100 h-full w-full">
            <i class="pi pi-eye text-white" style="font-size: x-large;"></i>
        </div>

        <img [src]="dog().imgUrl" alt="dog image" class="object-center object-cover h-full w-full">

    </a>

    <div class="flex flex-col pl-3 h-80 w-100 justify-between overflow-hidden">
        <p-scrollpanel [style]="{ height: '250px' }">
            <div>
                <h1 class="font-bold">Name</h1>
                <p class="text-base text-gray-800">{{ dog().name }}</p>
            </div>

            <div>
                <h1 class="font-bold">Breed</h1>
                <p class="text-base text-gray-800">{{ dog().breed }}</p>
            </div>

            <div>
                <h1 class="font-bold">Sex</h1>
                <p class="text-base text-gray-800">{{ dog().sex }}</p>
            </div>

            <div>
                <h1 class="font-bold">Description</h1>
                <p class="text-base text-gray-800">{{ dog().description }}</p>
            </div>
        </p-scrollpanel>

        <p-button type="button" (click)="adoptDog(dog().id)" size="large" label="Adopt" styleClass="w-full">
            <i class="pi pi-sparkles"></i>
        </p-button>
    </div>
</div>
